services:
  postgres:
    image: postgres:16-alpine
    container_name: knowledge-pay-rewrite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledge_pay_rewrite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_pay_rewrite"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
